<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITRON — Маркетплейс</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 50px; }
        
        /* Шапка */
        header { background: #1e272e; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .logo { font-size: 20px; font-weight: bold; color: #00b894; letter-spacing: 1px; }
        .nav-btns { display: flex; gap: 10px; align-items: center; }
        
        .btn-header { background: #222f3e; color: #fff; border: 1px solid #576574; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-cart { background: #00b894; border: none; color: white; }
        .badge { background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; margin-left: 4px; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        h2 { margin-bottom: 15px; font-size: 22px; color: #2c3e50; }

        /* Панель статистики отказов */
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; background: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-item { flex: 1; display: flex; flex-direction: column; }
        .stat-title { font-size: 11px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; margin-bottom: 3px; }
        .stat-value { font-size: 16px; font-weight: bold; color: #e74c3c; }

        /* Сетка товаров */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        /* Выезжающая корзина */
        .cart-drawer { position: fixed; top: 0; right: -400px; width: 100%; max-width: 380px; height: 100%; background: #fff; box-shadow: -5px 0 15px rgba(0,0,0,0.1); z-index: 1000; transition: right 0.3s ease; padding: 20px; display: flex; flex-direction: column; }
        .cart-drawer.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .cart-title { font-size: 18px; font-weight: bold; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
        
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        
        .cart-footer { border-top: 1px solid #eee; padding-top: 15px; }
        .cart-total { font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .status-alert { padding: 10px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 12px; }
        .status-alert.warning { background: #ffeaa7; color: #d63031; }
        .status-alert.success { background: #55efc4; color: #00b894; }
        .status-alert.error { background: #ff7675; color: #fff; }

        .btn-pay { width: 100%; padding: 12px; background: #00b894; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-pay:disabled { background: #b2bec3; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <div class="logo">MITRON</div>
        <div class="nav-btns">
            <button class="btn-header btn-cart" onclick="toggleCart(true)">
                🛒 Корзина <span id="cartBadge" class="badge">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        <h2>Витрина товаров</h2>
        
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-title">Отказалось от покупки СЕГОДНЯ</span>
                <span id="stat-refused-today" class="stat-value">0 чел.</span>
            </div>
            <div class="stat-item">
                <span class="stat-title">Всего отказов (31 день)</span>
                <span id="stat-refused-total" class="stat-value" style="color: #7f8c8d;">0 чел.</span>
            </div>
        </div>

        <div id="productGrid" class="product-grid">
        </div>
    </div>

    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <div class="cart-title">🛒 Ваша Корзина</div>
            <button class="close-btn" onclick="toggleCart(false)">✕</button>
        </div>

        <div id="cartItems" class="cart-items">
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Итого:</span>
                <span id="cartTotalM">0 M</span>
            </div>

            <div class="form-group">
                <label for="usernameInput">Логин покупателя:</label>
                <input type="text" id="usernameInput" value="Покупатель" placeholder="Введите ваш логин">
            </div>

            <div id="cartHint" class="status-alert warning">
                Добавьте товары в корзину для оформления заказа.
            </div>

            <button id="payBtn" class="btn-pay" onclick="processPayment()" disabled>ОПЛАТИТЬ ЗАКАЗ</button>
        </div>
    </div>

    <script src="shop.js"></script>
</body>
    </html>
